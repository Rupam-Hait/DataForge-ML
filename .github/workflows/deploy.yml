name: Build and Deploy DataForge ML

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build and Test Fullstack Application
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Verify Backend Imports & App Startup
      run: |
        python -c "import fastapi, sklearn, numpy, pandas; print('All ML & Backend dependencies verified successfully!')"

    - name: Build Docker Container
      run: |
        docker build -t dataforge-ml-studio:latest .

    - name: Test Docker Container Startup
      run: |
        docker run -d -p 8000:8000 --name test-container dataforge-ml-studio:latest
        sleep 5
        curl -f http://localhost:8000/health || exit 1
        docker stop test-container
